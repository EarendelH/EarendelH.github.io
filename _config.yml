# Academic Pages / Jekyll configuration
locale: "en-US"
site_theme: "ziheng"
title: "Ziheng Wang"
title_separator: "·"
name: &name "Ziheng Wang"
description: &description "Academic homepage of Ziheng Wang — AI for EDA, reinforcement learning, and high-performance computing."
url: "https://earendelh.github.io"
baseurl: ""
repository: "EarendelH/EarendelH.github.io"

author:
  avatar: "profile.jpg"
  name: "Ziheng Wang"
  bio: "Undergraduate researcher in AI for EDA and high-performance computing."
  location: "Shenzhen, China"
  employer: "Southern University of Science and Technology"
  email: "12310401@mail.sustech.edu.cn"
  github: "EarendelH"

publication_category:
  conferences:
    title: "Conference Papers"

breadcrumbs: false
words_per_minute: 180
future: false
read_more: "enabled"
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
comments:
  provider:
atom_feed:
  hide: false
  path: "/feed.xml"
analytics:
  provider: "false"

include:
  - _pages
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - node_modules
  - vendor
  - scripts
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - AGENTS.md
  - "Ziheng Wang CV.pdf"

keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
excerpt_separator: "<!-- more -->"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      comments: false
      share: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /blog/:year/:month/:day/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
